<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD to PLN Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>USD / PLN Converter</h1>

        <div class="converter-card">
            <div class="input-group">
                <label for="direction">Kierunek</label>
                <select id="direction">
                    <option value="PLN">PLN ➜ USD</option>
                    <option value="USD">USD ➜ PLN</option>
                </select>
            </div>

            <div class="input-group">
                <label for="amount">Kwota</label>
                <input type="number" id="amount" placeholder="Wpisz kwotę" step="0.01">
            </div>

            <button id="convertBtn" onclick="convertCurrency()">Przelicz</button>

            <div id="result" class="result-display">
                <!-- Result will be shown here -->
            </div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h2>Historia Przewalutowań</h2>
                <div class="filter-controls">
                    <button onclick="filterHistory('all')" class="filter-btn active">Wszystkie</button>
                    <button onclick="filterHistory('max')" class="filter-btn">TOP 5 Największych</button>
                    <button onclick="filterHistory('min')" class="filter-btn">TOP 5 Najmniejszych</button>
                </div>
            </div>

            <div class="history-list" id="historyList">
                <!-- History items will be injected here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
